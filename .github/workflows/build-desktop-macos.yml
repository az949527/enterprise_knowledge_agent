name: Build macOS Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: read

concurrency:
  group: macos-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-desktop.txt
            requirements-desktop-build.txt

      - name: Show build environment
        run: |
          python --version
          uname -a
          uname -m

      - name: Build clean macOS application
        env:
          PYTHON_BIN: python3
          INDEX_URL: https://pypi.org/simple
        run: |
          chmod +x scripts/build_desktop_macos.sh
          ./scripts/build_desktop_macos.sh

      - name: Validate application architecture
        run: |
          file outputs/releases/macos/LocalKnowledgeTool.app/Contents/MacOS/LocalKnowledgeTool

      - name: Name release artifact
        run: |
          mv outputs/releases/LocalKnowledgeTool-macOS.zip \
             outputs/releases/LocalKnowledgeTool-macOS-${{ matrix.arch }}.zip
          shasum -a 256 \
            outputs/releases/LocalKnowledgeTool-macOS-${{ matrix.arch }}.zip \
            > outputs/releases/LocalKnowledgeTool-macOS-${{ matrix.arch }}.zip.sha256

      - name: Upload macOS release
        uses: actions/upload-artifact@v4
        with:
          name: LocalKnowledgeTool-macOS-${{ matrix.arch }}
          path: |
            outputs/releases/LocalKnowledgeTool-macOS-${{ matrix.arch }}.zip
            outputs/releases/LocalKnowledgeTool-macOS-${{ matrix.arch }}.zip.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
