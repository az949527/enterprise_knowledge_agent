name: Build Windows Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-desktop.txt
            requirements-desktop-build.txt

      - name: Install desktop environment
        shell: pwsh
        run: |
          .\scripts\install_desktop.ps1 `
            -IndexUrl https://pypi.org/simple `
            -PythonExe (Get-Command python).Source

      - name: Run desktop tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $log = @(& .\.venv-desktop\Scripts\python.exe -m unittest discover -s tests -v 2>&1)
          $code = $LASTEXITCODE
          $log | ForEach-Object { $_ }
          for ($i = 0; $i -lt $log.Count; $i++) {
            $line = [string]$log[$i]
            if ($line -match '^(FAIL|ERROR): ') {
              Write-Output "::error file=tests::$line"
              $details = 0
              for ($j = $i + 1; $j -lt $log.Count -and $details -lt 12; $j++) {
                $next = [string]$log[$j]
                if ($next -match '^(=====|Ran [0-9]+|OK$|FAILED )') { break }
                if ($next.Trim().Length -gt 0 -and $next -notmatch '^-----') {
                  Write-Output "::error file=tests::  $($next.Trim())"
                  $details++
                }
              }
            }
          }
          if ($code -ne 0) { exit $code }

      - name: Build Windows application
        shell: pwsh
        run: .\scripts\build_desktop_windows.ps1 -IndexUrl https://pypi.org/simple

      - name: Create checksum
        shell: pwsh
        run: |
          $zip = "outputs/releases/LocalKnowledgeTool-Windows-x64.zip"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          "$hash  LocalKnowledgeTool-Windows-x64.zip" |
            Set-Content -Encoding ascii "$zip.sha256"

      - name: Upload Windows release
        uses: actions/upload-artifact@v4
        with:
          name: LocalKnowledgeTool-Windows-x64
          path: |
            outputs/releases/LocalKnowledgeTool-Windows-x64.zip
            outputs/releases/LocalKnowledgeTool-Windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
